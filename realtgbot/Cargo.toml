[package]
name = "realtgbot"
version = "0.1.0"
edition = "2021"
description = "Pocket Real - Telegram DEX Trading Bot for Real.xyz on IOTA"

[[bin]]
name = "realtgbot"
path = "src/main.rs"

[dependencies]
# Real Markets SDK (git dependency)
sdk = { git = "https://github.com/realmarkets/rust-sdk", package = "sdk" }

# Telegram bot framework
teloxide = { version = "0.13", features = ["macros", "throttle"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Environment / config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }

# Cryptography & Zeroization
aes-gcm = "0.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
sha2 = "0.10"

# The Real.xyz SDK depends on fastcrypto via git at rev 69d496c (crate version
# 0.1.8) while requiring ^0.1.11. Its workspace patches that git source to
# crates.io 0.1.11, but Cargo does not inherit [patch] from a git dependency.
# crates.io 0.1.11 is the 2026-07-02 publish of 47f8f6b — the same commit this
# repo used to force in via [patch.crates-io]. iota-sdk-crypto also requires
# registry fastcrypto =0.1.11, so overriding the registry copy with the git rev
# makes the two sources fail to unify. Mirror the SDK patch here instead.
[patch."https://github.com/MystenLabs/fastcrypto"]
fastcrypto = "=0.1.11"
